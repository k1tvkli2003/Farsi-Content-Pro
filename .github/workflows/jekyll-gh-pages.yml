# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: (DISABLED) Deploy Jekyll with GitHub Pages dependencies preinstalled

# NOTE:
# این ورک‌فلو قبلاً برای Jekyll بود، ولی الان اپ با Vite ساخته و دیپلوی می‌شود (فایل deploy.yml).
# برای جلوگیری از تداخل و این‌که GitHub Pages دوباره index.html خام را با <script src="index.tsx"> منتشر نکند،
# این ورک‌فلو را از روی push غیرفعال می‌کنیم و فقط به صورت دستی قابل اجراست.

on:
  # فقط اجرای دستی از تب Actions (دیگر روی push اجرا نمی‌شود)
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
